name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Format, vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The oldest supported toolchain, as declared in go.mod.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Node runs the viewer's DOM/canvas contract tests from the Go suite.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt is needed for:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      # Tests use synthetic stacks only. Graphviz is not installed here, so the
      # checks that render with Neato are skipped, as they are on any machine
      # without it.
      - name: Test
        run: go test -race ./...
      # The framing tests need the pinned PDF libraries; install them privately.
      - name: Test the optional Python scripts
        run: |
          python3 -m venv "$RUNNER_TEMP/pdf"
          "$RUNNER_TEMP/pdf/bin/python" -m pip install --quiet -r scripts/requirements-pdf.txt
          "$RUNNER_TEMP/pdf/bin/python" -m unittest discover -s scripts -p 'test_*.py'
